services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arthdrishti
      POSTGRES_USER: arthdrishti
      POSTGRES_PASSWORD: arthdrishti
    ports:
      - "5432:5432"
    volumes:
      - arthdrishti_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arthdrishti -d arthdrishti"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arthdrishti_postgres:
